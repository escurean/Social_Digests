# Render Blueprint for Social Digests
# Deploys: Postgres + Key Value (Redis) + backend API (Docker) + frontend (static site).
# Strapi CMS (cms/) is intentionally NOT deployed — the backend doesn't depend on it.
# All plans are free. Everything is in Frankfurt (closest Render region to Nairobi).

databases:
  - name: social-digests-db
    plan: free
    region: frankfurt
    databaseName: social_digests
    user: social_digests

services:
  # ── Redis (used by ioredis cache + Bull email queue) ──────────────
  - type: keyvalue
    name: social-digests-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction   # Bull needs keys not to be evicted
    ipAllowList: []               # internal connections only

  # ── Backend API ───────────────────────────────────────────────────
  - type: web
    name: social-digests-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: social-digests-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: social-digests-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_DAYS
        value: "30"
      # Set to the frontend URL after first deploy, e.g. https://social-digests-web.onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_PASSKEY
        sync: false
      # e.g. https://social-digests-api.onrender.com/api/donations/mpesa/callback
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: no-reply@socialdigests.com
      - key: CLOUDINARY_URL
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ── Frontend (Vite SPA) ───────────────────────────────────────────
  - type: web
    name: social-digests-web
    runtime: static
    rootDir: frontend
    # API_HOST is Render's internal hostname (e.g. social-digests-api-esl7), so add the public domain
    buildCommand: npm ci && VITE_API_URL=https://${API_HOST}.onrender.com npm run build
    staticPublishPath: dist
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: social-digests-api
          property: host
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
